# ─────────────────────────────────────────────────────────────
#  GitHub Actions — FREE CI/CD Pipeline
#
#  FREE TIER USAGE:
#    GitHub Actions:       2,000 min/month free (public repos: unlimited)
#    GitHub Container Registry (GHCR): free for public repos
#    Railway deployment:   via Railway GitHub integration (free)
#
#  What happens on every push to main:
#    1. Run Jest tests
#    2. npm audit (security check)
#    3. Build + push Docker image to GHCR (free)
#    4. Railway auto-deploys from GHCR (configured in Railway dashboard)
# ─────────────────────────────────────────────────────────────
name: CyberShield 360 — Free CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cybershield360

jobs:

  # ── Test ──────────────────────────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest       # free on GitHub Actions
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          
          

      - run: npm ci

      - name: Run tests
        run: npm test -- --ci --coverage --forceExit
        env:
          NODE_ENV: test
          PORT: 3001

      - name: Security audit
        run: npm audit --audit-level=moderate || true   # warn only

  # ── Build & push to GHCR (FREE) ───────────────────────────
  build:
    name: 🐳 Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # built-in, no setup needed!

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha          # GitHub Actions cache (free)
          cache-to:   type=gha,mode=max

      - name: Image pushed
        run: |
          echo "✅ Image pushed to GHCR:"
          echo "   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "Railway will auto-deploy this image."
          echo "Check: https://railway.app/dashboard"

  # ── Railway deploys automatically via GitHub integration ──
  # No extra steps needed — Railway watches your repo and
  # triggers a deploy whenever main is updated.
  # Setup once in Railway dashboard: New Project → GitHub Repo
